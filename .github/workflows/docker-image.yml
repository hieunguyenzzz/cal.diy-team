name: "GHCR Docker Image"

# Builds the production image in GitHub Actions instead of on the OVH host,
# since the shared Dokploy host doesn't have enough RAM to build reliably.

permissions:
  contents: read
  packages: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/hieunguyenzzz/cal.diy-team

jobs:
  build:
    name: "Build and push"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}

      # Build-only values. These are never used at runtime - Dokploy's own
      # env vars (real secrets) are injected into the running container, and
      # scripts/start.sh rewrites the baked NEXT_PUBLIC_WEBAPP_URL at boot.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            NEXT_PUBLIC_API_V2_URL=http://localhost:5555/api/v2
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/calcom
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: "Trigger Dokploy deploy"
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
    steps:
      # Job-level `if:` can't reference `secrets` directly (breaks workflow parsing),
      # so skip the step itself until DOKPLOY_DEPLOY_WEBHOOK is added after the switchover.
      - name: Call Dokploy deploy webhook
        if: env.DEPLOY_WEBHOOK != ''
        run: curl -fsSL -X POST "$DEPLOY_WEBHOOK"
